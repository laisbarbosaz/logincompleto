<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}">
<head><title>Login</title></head>
<body>
<main class="card">
    <h1>Entrar</h1>
    <p th:if="${param.error}" class="alert error">E-mail ou senha inválidos.</p>
    <p th:if="${param.logout}" class="alert ok">Você saiu com sucesso.</p>
    <p th:if="${param.registered}" class="alert ok">Cadastro realizado! Faça login.</p>

    <form th:action="@{/login}" method="post">
        <label>E-mail <input type="email" name="email" required></label>
        <label>Senha <input type="password" name="password" required></label>
        <button type="submit">Entrar</button>
    </form>
    <p class="link"><a th:href="@{/register}">Criar conta</a></p>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}">
<head><title>Usuários</title></head>
<body>
<main class="card wide">
    <h1>Gerenciar usuários</h1>
    <div class="table-wrap">
    <table>
        <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.name}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${#strings.setJoin(u.roles, ', ')}"></td>
            <td th:text="${u.enabled} ? 'Ativo' : 'Desativado'"></td>
            <td class="actions">
                <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post">
                    <select name="role">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <button type="submit" class="btn-small">Alterar</button>
                </form>
                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                    <button type="submit" class="btn-small secondary"
                            th:text="${u.enabled} ? 'Desativar' : 'Ativar'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
